<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens instead of showing a zoomed-out desktop page -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Always show the light design, even on phones set to dark mode -->
  <meta name="color-scheme" content="light">
  <title>Cafe Inventory</title>
  <!-- Page styles (phone-first, high contrast) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- One page for both lists: the link decides which (no ?area = the
       kitchen, ?area=foh = front of house). script.js sets this heading
       and the tab title for the list before it loads (issue #37). -->
  <h1>Kitchen Inventory</h1>

  <!-- Tab buttons. aria-selected marks the open tab; script.js switches them.
       The app always opens on Count. -->
  <nav class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" id="tab-count"
            aria-controls="count-view" aria-selected="true">Count</button>
    <button type="button" class="tab" role="tab" id="tab-dashboard"
            aria-controls="dashboard-view" aria-selected="false">Dashboard</button>
  </nav>

  <main>
    <!-- Count tab: every item in this list (plus the Shared items), in
         shelf order, with Out / Low / Good buttons.
         JavaScript fills #item-list with a heading and items per category. -->
    <section id="count-view" role="tabpanel" aria-labelledby="tab-count">
      <div id="item-list"></div>
      <!-- Shown at the bottom of the screen when a reload of the list
           fails (e.g. offline). The list on screen stays; this says it
           may be out of date. role="status" makes screen readers read it. -->
      <div id="count-notice" class="refresh-notice" role="status" hidden>
        <!-- The message, and under it a short "Details: list · timed out"
             line filled in by script.js, so a screenshot shows why
             (issue #34). -->
        <div class="notice-text">
          <p>Couldn't refresh the list. Statuses may be out of date.</p>
          <p class="load-details"></p>
        </div>
        <button type="button" id="count-retry" class="retry-button">Try again</button>
      </div>
    </section>

    <!-- Dashboard tab (the GM's shopping list): Out, then Low, then Good.
         Hidden until the Dashboard tab is opened. -->
    <section id="dashboard-view" role="tabpanel" aria-labelledby="tab-dashboard" hidden>
      <button type="button" id="refresh-button" class="refresh-button">Refresh</button>
      <div id="dashboard-list"></div>
      <!-- Same bar as the Count tab's: shown when a reload after coming
           back to the page fails. The list on screen stays. -->
      <div id="dashboard-notice" class="refresh-notice" role="status" hidden>
        <!-- The message, and under it a short "Details: list · timed out"
             line filled in by script.js, so a screenshot shows why
             (issue #34). -->
        <div class="notice-text">
          <p>Couldn't refresh the list. Statuses may be out of date.</p>
          <p class="load-details"></p>
        </div>
        <button type="button" id="dashboard-retry" class="retry-button">Try again</button>
      </div>
    </section>

    <!-- Shown instead of the tabs and lists when the link's ?area= isn't
         a list the app knows (a typo like ?area=bar, issue #37). script.js
         shows it; on this screen nothing signs in, loads or saves. -->
    <section id="unknown-area" hidden>
      <p class="message">This link doesn't match a list. Open one of these:</p>
      <a class="area-link" href="./">Kitchen</a>
      <a class="area-link" href="./?area=foh">Front of House</a>
    </section>
  </main>

  <!-- Supabase library first (from the CDN), then your script, which uses it.
       PINNED to one exact version (2.119.2, the one the app was tested with),
       so a new supabase-js release can't change the app in the kitchen
       without being tested first.
       To update: change the version number below (see the list at
       https://www.npmjs.com/package/@supabase/supabase-js?activeTab=versions),
       then retest on a phone: items load, a tap saves, the Dashboard loads,
       and a failed save (airplane mode) shows "Didn't save, tap again". -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
  <script src="script.js"></script>
</body>

</html>
