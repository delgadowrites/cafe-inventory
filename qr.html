<!DOCTYPE html>
<html lang="en">

<!--
  qr.html - printable QR code signs (issue #4; front of house, issue #39).
  Open this page and print it (Cmd+P / Ctrl+P). Scanning the code opens
  the live app.
    qr.html           -> the kitchen sign (opens the kitchen list)
    qr.html?area=foh  -> the barista station sign (opens the
                         front-of-house list, ?area=foh)
  Any other ?area shows a message instead of a code, so a wrong sign
  can't be printed.
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Inventory QR Code</title>
  <style>
    /* Plain black on white: highest contrast for phone cameras and print. */
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #000;
      background: #fff;
      text-align: center;
    }

    /* The printed sign: label above, big code, URL below. */
    .sign {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
      border: 4px solid #000;
    }

    h1 {
      font-size: 2.2rem;
      margin: 0 0 16px;
    }

    /* The SVG scales to the box width, so the code stays sharp in print.
       The library adds a white "quiet zone" margin that scanners need. */
    #qr svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* The URL in text, as a backup if a camera won't scan. */
    .url {
      font-size: 1.1rem;
      word-break: break-all;
      margin: 16px 0 0;
    }

    .print-button {
      min-height: 48px;
      margin-top: 24px;
      padding: 0 24px;
      font: inherit;
      font-weight: bold;
      color: #000;
      background: #fff;
      border: 3px solid #000;
      border-radius: 6px;
      cursor: pointer;
    }

    /* "Unknown area: no sign printed" (issue #39): big and bold. */
    .unknown-area {
      font-size: 1.5rem;
      font-weight: bold;
    }

    /* Make sure `hidden` elements stay hidden. */
    [hidden] {
      display: none !important;
    }

    /* When printing: no Print button, and keep the sign on one page. */
    @media print {
      body { padding: 0; }
      .print-button { display: none; }
      .sign { page-break-inside: avoid; }
    }
  </style>
</head>

<body>
  <div class="sign">
    <h1>Scan to update inventory</h1>
    <div id="qr" role="img" aria-label="QR code that opens the Cafe Inventory app"></div>
    <p class="url" id="qr-url"></p>
  </div>

  <button type="button" class="print-button" onclick="window.print()">Print</button>

  <!-- Shown instead of the sign and the Print button when ?area= isn't
       a known list (issue #39). -->
  <p class="unknown-area" id="unknown-area" hidden>Unknown area: no sign printed</p>

  <!-- QR code library (pinned version), from the jsDelivr CDN -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    // The live GitHub Pages address. It's written out here on purpose
    // (not taken from the current page address), so a code printed while
    // testing on localhost still points at the real app.
    const APP_URL = "https://delgadowrites.github.io/cafe-inventory/";

    // One sign per list (issue #39), all in this one table:
    //   url:     what the code opens (the live app, plus ?area= for FOH)
    //   heading: the big text above the code
    //   label:   what screen readers say for the code
    //   title:   the browser tab's title
    // The kitchen entry is exactly the original sign, so the posted
    // kitchen sign prints the same as before. No phone numbers here: the
    // repo is public, so Carlos writes his number on the printed sign.
    const SIGNS = {
      kitchen: {
        url: APP_URL,
        heading: "Scan to update inventory",
        label: "QR code that opens the Cafe Inventory app",
        title: "Cafe Inventory QR Code",
      },
      foh: {
        url: APP_URL + "?area=foh",
        heading: "Scan to update front-of-house inventory",
        label: "QR code that opens the Front of House Inventory list",
        title: "Front of House Inventory QR Code",
      },
    };

    // Which sign: ?area= from this page's address, with spaces and
    // capitals ignored (like the app). Missing or empty = the kitchen.
    // Anything not in SIGNS (a typo like ?area=bar) gets no sign.
    const area = (new URLSearchParams(location.search).get("area") ?? "")
      .trim()
      .toLowerCase() || "kitchen";
    const sign = Object.keys(SIGNS).includes(area) ? SIGNS[area] : null;

    if (sign === null) {
      // Unknown area: hide the sign and the Print button and say why,
      // so a sign for the wrong list (or no list) can't be printed.
      document.querySelector(".sign").hidden = true;
      document.querySelector(".print-button").hidden = true;
      document.getElementById("unknown-area").hidden = false;
    } else {
      document.title = sign.title;
      document.querySelector("h1").textContent = sign.heading;
      document.getElementById("qr").setAttribute("aria-label", sign.label);

      // qrcode(0, "Q"):
      //   0   = pick the smallest QR size that fits the URL
      //   "Q" = high error correction: still scans if ~25% of the code is
      //         smudged or splashed, which helps on a kitchen wall.
      const qr = qrcode(0, "Q");
      qr.addData(sign.url);
      qr.make();

      // Draw it as an SVG (crisp at any print size).
      // margin: 4 cells of white border, the "quiet zone" scanners need.
      // scalable: lets the CSS above set the size.
      document.getElementById("qr").innerHTML = qr.createSvgTag({
        cellSize: 8,
        margin: 4,
        scalable: true,
      });

      // Print the URL under the code too.
      document.getElementById("qr-url").textContent = sign.url;
    }
  </script>
</body>

</html>
